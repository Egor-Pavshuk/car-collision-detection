[project]
name = "car-collision-detection"
version = "0.1.0"
description = ""
authors = [
    {name = "Egor-Pavshuk",email = "kir197152@gmail.com"}
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "tqdm (>=4.69.0,<5.0.0)",
    "ultralytics>=8.4.102",
    "opencv-python>=4.6",
    "torch (>=2.13.0,<3.0.0)",
    "torchvision (>=0.28.0,<0.29.0)",
    "numpy (==1.26.4)",
    "pandas (>=3.0.5,<4.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cu126"}
torchvision = { version = ">=0.27.0", source = "pytorch-cu126" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
